[project]
name = "bossdoc"
version = "0.0.0"
description = "Documentation of the BESIII Offline Software System"
requires-python = "~=3.14.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "BESIII",
    "HEP",
    "IHEP",
    "particle physics",
    "particles",
    "physics",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Changelog = "https://github.com/redeboer/bossdoc/releases"
Documentation = "https://bes3.rtfd.io"
Issues = "https://github.com/redeboer/bossdoc/issues"
Source = "https://github.com/redeboer/bossdoc"

[dependency-groups]
dev = [
    { include-group = "doc" },
    { include-group = "linkcheck" },
]
doc = ["quarto-cli"]
linkcheck = ["lychee-bin>=0.24.0"]  # pyproject.toml config support

[tool.compwa.policy.github]
no-cd = true

[tool.compwa.policy.repo]
keep-issue-templates = true

[tool.lychee]
cache = true
cache_exclude_status = "400.."
# [:] keeps Lychee from extracting regex patterns as URLs.
exclude = [
    '^http://bes3db\.ihep\.ac\.cn/online/webserver/runinfo/runparams\.php$',  # Only reachable from the IHEP network
    '^http://bes3run\.ihep\.ac\.cn/?$',  # Only reachable from the IHEP network
    '^http://koala\.ihep\.ac\.cn/cgi-bin/viewcvs\.cgi/BossCvs$',  # Only reachable from the IHEP network
    '^http://twiki\.ihep\.ac\.cn/twiki/view/BES/BOSS/WebHome$',  # Only reachable from the IHEP network
    '^http://web\.ihep\.ac\.cn/?$',  # Only reachable from the IHEP network
    '^http[:]//link\.springer\.com/10\.1140/epjc/s10052-014-3026-9$',  # Publisher redirects automated requests through a cookie challenge
    '^https[:]//bes3\.to\.infn\.it/Boss/7\.0\.2/html/',  # Legacy documentation has an untrusted TLS certificate
    '^https[:]//boss\.ihep\.ac\.cn/~offlinesoftware/',  # Requires IHEP single sign-on
    '^https[:]//ccsuser\.ihep\.ac\.cn/?$',  # Requires authentication
    '^https[:]//code\.ihep\.ac\.cn/',  # Every page redirects anonymous requests to the sign-in page
    '^https[:]//dayabay\.bnl\.gov/dox/GaudiKernel/html/',  # Legacy documentation has an untrusted TLS certificate
    '^https[:]//dev\.mysql\.com/doc/refman/8\.0/en/$',  # Rejects automated requests with 403
    '^https[:]//docbes3\.ihep\.ac\.cn/(~|cgi-bin/DocDB/|viewvc/)',  # Requires IHEP single sign-on
    '^https[:]//github\.com/redeboer/bossdoc/edit/main/appendices/remote-shift\.qmd$',  # Requires authentication
    '^https[:]//github\.com/redeboer/bossdoc/issues/new$',  # Requires authentication
    '^https[:]//github\.com/signup$',  # Rejects automated requests with 403
    '^https[:]//gitlab\.ep1\.rub\.de/Bes3/Yapp$',  # Requires authentication
    '^https[:]//hnbes3\.ihep\.ac\.cn//HyperNews/get/software\.html$',  # Requires IHEP single sign-on
    '^https[:]//indico\.ihep\.ac\.cn/event/8795/contributions/104340/attachments/55835/64270/hunan\.pdf$',  # Requires authentication
    '^https[:]//lhcb-comp\.web\.cern\.ch/lhcb-comp/support/CMT/cmt\.htm$',  # Requires authentication
    '^https[:]//login\.ihep\.ac\.cn/?$',  # Redirects to the sign-in form
    '^https[:]//twiki\.cern\.ch/twiki/bin/view/LHCb/GaudiAlgorithm$',  # Requires authentication
    '^https[:]//www\.gnu\.org/software/trans-coord/manual/cvs/html_node/CVS-commands\.html$',  # Resets connections from some networks
]
exclude_path = [
    "_extensions",
]
extensions = ["bib", "md", "qmd", "yml"]
hidden = true  # Include the workflows under .github/
include_fragments = "anchor-only"
include_verbatim = true
max_cache_age = "7d"
max_concurrency = 10
user_agent = "Mozilla/5.0 (compatible; lychee)"

[tool.poe.executor]
isolated = true
no-group = "dev"
type = "uv"

[tool.poe.groups.doc]
heading = "Documentation"

[tool.poe.groups.doc.tasks.doc]
cmd = "quarto render --no-clean"
executor = { group = "doc" }
help = "Build website"

[tool.poe.groups.doc.tasks.doclive]
cmd = "quarto preview --no-clean"
executor = { group = "doc" }
help = "Set up a server to directly preview changes to the HTML pages"

[tool.poe.groups.doc.tasks.linkcheck]
cmd = "lychee ."
executor = { group = "linkcheck" }
help = "Check external links in the source files (requires an internet connection)"

[tool.poe.tasks.all]
help = "Run all continuous integration (CI) tasks locally"
ignore_fail = "return_non_zero"
sequence = [
    "style",
    "linkcheck",
    "doc",
]

[tool.poe.tasks.style]
cmd = "prek run --all-files"
help = "Perform all linting, formatting, and spelling checks"

[tool.poe.tasks.upgrade]
executor = { type = "simple" }
help = "Upgrade lock files"
parallel = [
    "_upgrade-precommit",
    "_upgrade-uv",
]

[tool.poe.tasks._upgrade-precommit]
cmd = "prek autoupdate"
executor = { type = "simple" }

[tool.poe.tasks._upgrade-uv]
cmd = "uv lock --upgrade"
executor = { type = "simple" }

[tool.tombi.files]
exclude = ["**/uv.lock"]

[tool.tombi.format.rules]
indent-width = 4
line-width = 88

[tool.tombi.lint.rules]
key-empty = "off"

[[tool.tombi.schemas]]
root = "tool.compwa.policy"
path = "https://raw.githubusercontent.com/ComPWA/policy/0.10.4/compwa-policy.schema.json"
include = ["pyproject.toml"]
